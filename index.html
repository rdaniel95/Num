<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>565</title>

<!-- Preview para WhatsApp/Facebook (Open Graph) -->
<meta property="og:title" content="565">
<meta property="og:description" content="Azteca Guate el mejor canal">
<meta property="og:image" content="https://rdaniel95.github.io/Num/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:'Courier New', monospace;
    cursor:pointer;
  }
  #start {
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#0f0;
    font-size:5rem;
    text-shadow:0 0 12px #0f0;
    user-select:none;
  }
  #hack {
    display:none;
    height:100%;
    padding:16px;
    color:#0f0;
    overflow:hidden;
    position:relative;
  }
  #stream {
    position:absolute;
    top:16px; left:16px; right:16px;
    font-size:0.9rem;
    line-height:1.25;
    opacity:0.55;
    white-space:pre-wrap;
    word-break:break-all;
  }
  #big {
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  #num {
    font-size:22vw;
    font-weight:bold;
    text-shadow:0 0 25px #0f0, 0 0 50px #0f0;
    letter-spacing:2px;
  }
  #label {
    font-size:1.4rem;
    letter-spacing:6px;
    margin-top:10px;
    text-shadow:0 0 10px #0f0;
    animation:blink 0.8s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity:0.2; } }
  #flash {
    position:absolute; inset:0;
    background:#0f0; opacity:0;
    pointer-events:none;
  }
</style>
</head>
<body>
  <div id="start">565 ▄</div>

  <div id="hack">
    <div id="stream"></div>
    <div id="big">
      <div id="num">565</div>
      <div id="label">Azteca Guate el mejor canal</div>
    </div>
    <div id="flash"></div>
  </div>

<script>
  const startEl = document.getElementById('start');
  const hackEl  = document.getElementById('hack');
  const numEl   = document.getElementById('num');
  const labelEl = document.getElementById('label');
  const streamEl= document.getElementById('stream');
  const flashEl = document.getElementById('flash');

  const hexLine = () => {
    let s = '';
    const parts = 12 + Math.floor(Math.random()*8);
    for (let i=0;i<parts;i++){
      s += Math.floor(Math.random()*0xFFFF).toString(16).padStart(4,'0') + ' ';
    }
    return s;
  };

  const messages = [
    '> Conectando con Azteca Guate...',
    '> Midiendo audiencia: OK',
    '> Procesando rating nacional',
    '> Azteca Guate #1 en audiencia',
    '> Subiendo el rating...',
    '> Descargando datos',
    '> En los primeros lugares',
    '> El mejor canal confirmado'
  ];

  // --- audio (pitido generado en el navegador) ---
  let audioCtx = null;
  function beep(freq, dur) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.value = 0.06;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    osc.stop(audioCtx.currentTime + dur);
  }

  function vibrar(patron) {
    if (navigator.vibrate) navigator.vibrate(patron);
  }

  function launch() {
    // intenta pantalla completa y audio (pueden fallar sin gesto: no importa)
    try {
      const el = document.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen || function(){}).call(el);
    } catch(e) {}
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {}

    vibrar([0, 300, 100, 300, 100, 500]);

    startEl.style.display = 'none';
    hackEl.style.display = 'block';

    let n = 565;
    let msgIdx = 0;

    // flujo de texto tipo terminal
    const streamTimer = setInterval(() => {
      let line = Math.random() < 0.25 && msgIdx < messages.length
        ? messages[msgIdx++]
        : hexLine();
      streamEl.textContent = (line + '\n' + streamEl.textContent).split('\n').slice(0, 40).join('\n');
    }, 60);

    // el contador se acelera
    let delay = 90;
    function tick() {
      numEl.textContent = n;
      // pitido corto en cada número (tono sube con la velocidad)
      beep(600 + (n % 400), 0.05);
      n++;
      // parpadeo de fondo + alarma ocasional
      if (n % 50 === 0) {
        flashEl.style.opacity = 0.35;
        setTimeout(()=> flashEl.style.opacity = 0, 40);
        beep(1200, 0.15);      // pitido de alarma agudo
        vibrar([0, 200, 80, 200]);  // sacudida
      }
      // cambia el mensaje inferior
      if (n % 111 === 0) {
        const opciones = ['HACKEANDO...','Azteca Guate el mejor canal','En los primeros lugares de audiencia','Descargando datos','Subiendo el rating'];
        labelEl.textContent = opciones[Math.floor(Math.random()*opciones.length)];
        vibrar(400);
      }
      if (delay > 8) delay -= 0.4; // acelera poco a poco
      setTimeout(tick, delay);
    }
    tick();
  }

  // Arranque automático al abrir (sin click). Sin gesto no hay audio,
  // pero el conteo y todo lo visual funcionan igual.
  window.addEventListener('load', () => setTimeout(launch, 400));

  // Si además tocan la pantalla, intenta pantalla completa + audio + vibración.
  function potenciar() {
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen || function(){}).call(el);
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if (navigator.vibrate) navigator.vibrate([0,300,100,300]);
  }
  document.body.addEventListener('click', potenciar);
  document.body.addEventListener('touchstart', potenciar);
</script>
</body>
</html>
